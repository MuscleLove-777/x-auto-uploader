name: Codex one-time X authentication check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-once-x-authentication
  cancel-in-progress: false

jobs:
  auth-check:
    if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP dependencies
        run: python -m pip install requests==2.32.5 requests-oauthlib==2.0.0
      - name: Verify offline checks
        run: python -B -m unittest test_cloud_once -v
      - name: Check existing X credentials once (read only)
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -B cloud_once.py --live-auth-check
      - name: Preserve sanitized result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-once-auth-result-${{ github.run_id }}
          path: cloud_once_result.json
          if-no-files-found: ignore
          retention-days: 7
